<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Raksha Bandhan 2026</title>
<style>
  :root{
    --maroon:#7a1f2b;
    --gold:#d4af37;
    --cream:#fff8ec;
    --pink:#e75480;
    --deep-orange:#e2711d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Georgia', 'Segoe UI', serif;
    background:radial-gradient(circle at 20% 20%, #fff3d6, transparent 60%),
               radial-gradient(circle at 80% 80%, #ffd9e6, transparent 60%),
               linear-gradient(135deg, #fff8ec, #ffe9c7);
    overflow:hidden;
    position:relative;
  }
 
  /* floating decorative dots (mimic diyas/petals) */
  .deco{
    position:absolute;
    border-radius:50%;
    opacity:0.7;
    animation:float 8s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0px) rotate(0deg);}
    50%{transform:translateY(-25px) rotate(15deg);}
  }
 
  .card{
    position:relative;
    background:var(--cream);
    border:6px solid var(--gold);
    border-radius:24px;
    padding:50px 40px;
    max-width:520px;
    width:90%;
    text-align:center;
    box-shadow:0 25px 60px rgba(122,31,43,0.25);
    z-index:2;
  }
 
  .card::before, .card::after{
    content:"";
    position:absolute;
    width:60px;
    height:60px;
    border:3px solid var(--gold);
    border-radius:50%;
    top:-15px;
  }
  .card::before{left:-15px;}
  .card::after{right:-15px;}
 
  .rakhi-icon{
    width:90px;
    height:90px;
    margin:0 auto 10px;
    position:relative;
  }
  .rakhi-icon .thread{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:conic-gradient(var(--pink), var(--gold), var(--deep-orange), var(--pink));
    animation:spin 6s linear infinite;
  }
  .rakhi-icon .center{
    position:absolute;
    top:15px; left:15px; right:15px; bottom:15px;
    background:var(--cream);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
  }
  @keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
 
  h1{
    color:var(--maroon);
    font-size:2.1rem;
    margin:10px 0 5px;
    letter-spacing:1px;
  }
  .subtitle{
    color:var(--deep-orange);
    font-weight:bold;
    font-size:1.1rem;
    margin-bottom:20px;
  }
  p.message{
    color:#5a3d2b;
    font-size:1.05rem;
    line-height:1.7;
    margin:0 0 25px;
  }
  .date-pill{
    display:inline-block;
    background:var(--maroon);
    color:var(--cream);
    padding:8px 22px;
    border-radius:999px;
    font-size:0.95rem;
    letter-spacing:0.5px;
    margin-bottom:10px;
  }
  .signature{
    margin-top:20px;
    font-style:italic;
    color:var(--pink);
    font-size:1rem;
  }
</style>
</head>
<body>
 
  <!-- floating decorative circles -->
  <div class="deco" style="width:20px;height:20px;background:var(--pink);top:10%;left:15%;animation-delay:0s;"></div>
  <div class="deco" style="width:14px;height:14px;background:var(--gold);top:20%;left:80%;animation-delay:1s;"></div>
  <div class="deco" style="width:26px;height:26px;background:var(--deep-orange);top:75%;left:10%;animation-delay:2s;"></div>
  <div class="deco" style="width:18px;height:18px;background:var(--pink);top:80%;left:85%;animation-delay:1.5s;"></div>
  <div class="deco" style="width:12px;height:12px;background:var(--gold);top:50%;left:5%;animation-delay:0.5s;"></div>
  <div class="deco" style="width:16px;height:16px;background:var(--deep-orange);top:12%;left:50%;animation-delay:2.5s;"></div>
 
  <div class="card">
    <div class="rakhi-icon">
      <div class="thread"></div>
      <div class="center">🪢</div>
    </div>
 
    <h1>Happy Raksha Bandhan</h1>
    <div class="subtitle">✨ 2026 ✨</div>
    <div class="date-pill">Friday, 28th August 2026</div>
 
    <p class="message">
      A thread that carries a lifetime of love, laughter, and protection.
      Wishing you a Raksha Bandhan filled with sweet memories, warm hugs,
      and the unbreakable bond of family. 🎀
    </p>
 
    <div class="signature">With love, always 💕</div>
  </div>
 
</body>
</html>
